<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — ตู้แลกเหรียญ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center text-white">

  <div class="w-full max-w-sm bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-full bg-yellow-400 grid place-items-center text-slate-900 font-black text-2xl mb-4">฿</div>
      <h1 class="text-2xl font-bold">Admin Login</h1>
      <p class="text-slate-400 text-sm mt-1">ตู้แลกเหรียญ</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-1">Username</label>
        <input type="text" name="username" autocomplete="username" required
               class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-yellow-400 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm text-slate-300 mb-1">Password</label>
        <input type="password" name="password" autocomplete="current-password" required
               class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:border-yellow-400 focus:outline-none" />
      </div>
      <button type="submit" id="submit-btn"
              class="w-full py-2.5 rounded-lg bg-yellow-400 text-slate-900 font-bold hover:bg-yellow-300 transition disabled:opacity-50">
        เข้าสู่ระบบ
      </button>
      <p id="error" class="text-red-400 text-sm text-center hidden"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'กำลังเข้าสู่ระบบ...';

      const data = new FormData(form);
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: data.get('username'),
            password: data.get('password'),
          }),
        });
        if (res.ok) {
          location.href = '/admin/';
        } else {
          const body = await res.json().catch(() => ({}));
          errorEl.textContent = body.error || `เข้าสู่ระบบไม่สำเร็จ (${res.status})`;
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
